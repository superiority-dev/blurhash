version: "2"

linters:
  default: standard
  enable:
    - revive
    - gocritic
    - nilerr
    - nilnil
    - nilnesserr
    - modernize
    - intrange
    - mirror
    - usestdlibvars
    - copyloopvar
    - goconst
  settings:
    govet:
      enable:
        - nilness
    errcheck:
      # Writes to stdout, stderr and injected io.Writers carry no actionable
      # error, and neither does closing something opened only for reading.
      # Closing a file that was written to is different and stays checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (io.ReadCloser).Close
    goconst:
      # A string written twice is one meaning in two places. Strings passed
      # to calls count too: an empty exclude-types reads as unset, so
      # ignore-calls is the switch. Test tables repeat inputs so each row
      # reads on its own.
      min-occurrences: 2
      ignore-calls: false
      ignore-tests: true

formatters:
  enable:
    - gofmt
    - goimports
